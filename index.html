<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Simon Says Game</h1>
  <h2>Press any key to start the Game</h2>

  <div class="controls">
    <button id="modeToggle">Mode: Relaxed</button>
    <button id="playAgain" class="hidden">Play Again</button>
    <div id="highScore">High Score: 0</div>
  </div>

  <div class="btn-container">
    <div class="line1">
      <div class="btn pink" id="pink">1</div>
      <div class="btn blue" id="blue">2</div>
    </div>
    <div class="line2">
      <div class="btn mint" id="mint">3</div>
      <div class="btn yellow" id="yellow">4</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
